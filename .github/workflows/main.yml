name: Run Tests for Bike Rental

on:
  pull_request:
    branches:
      - master

  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest

    steps:
      # Checkout the repository
      - name: Checkout
        uses: actions/checkout@v3

      # Set up Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 16

      # Navigate to the correct directory and install dependencies
      - name: Install Dependencies
        working-directory: ./bikeRental # Adjust the path to your subdirectory
        run: npm install --save-dev supertest

      # Run tests
      - name: Run Tests
        working-directory: ./bikeRental # Adjust the path to your subdirectory
        run: npm test
